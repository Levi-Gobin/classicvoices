name: ClassicVoices
options:
  bundleIdPrefix: com.levigobin
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
    visionOS: "1.0"
settings:
  base:
    DEVELOPMENT_TEAM: 7WV49AN2BX
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    GCC_OPTIMIZATION_LEVEL: "3"          # the engine must be fast even in Debug
    GCC_PREPROCESSOR_DEFINITIONS: ["$(inherited)"]
    HEADER_SEARCH_PATHS: ["$(SRCROOT)/../core"]
    SWIFT_OBJC_BRIDGING_HEADER: Shared/Bridging.h
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    WARNING_CFLAGS: ["-Wno-unused-label", "-Wno-unused-variable", "-Wno-unused-function"]

# The app and its speech extension are built for iPhone/iPad, Mac and Apple
# Vision Pro from the same sources: each platform's pair of targets below only
# adds the platform, bundle identifiers and entitlements. (Apple TV can't have
# them: tvOS's Audio Unit extension point supports only iOS and visionOS.)
targetTemplates:
  # The C engines and generated code, compiled once per platform for both the
  # app and its extension: the generated code takes most of a GitHub build.
  EngineCode:
    type: library.static
    sources:
      - path: ../core
        includes: ["thumb.c", "vxengine.c", "vxstream.c", "vxphonemes.c", "vxrules.c", "vxlang.c"]
      - path: ../build/gen
        # LLVM's SLP vectorizer and classic GVN crawl through these huge
        # functions (290 s on one iOS 7.1.2 file) and the vectorizer slowed
        # the code: without it iOS 6 sentences are 17% faster, same output
        compilerFlags: &fastflags ["-fno-slp-vectorize", "-mllvm", "-enable-newgvn"]
      - path: ../build/gen3
        compilerFlags: *fastflags
      - path: ../build/gen4
        compilerFlags: *fastflags
      - path: ../build/gen5
        compilerFlags: *fastflags
      - path: ../build/gen7
        compilerFlags: *fastflags
      - path: ../build/gen70
        compilerFlags: *fastflags
      - path: ../build/gen10
        compilerFlags: *fastflags
      # recompiled MacinTalk (tools/build_mt_native.sh); only the generations
      # whose engines the build had
      - path: ../build/mtgen104
        optional: true
        compilerFlags: ["-O2", "-w"]
      - path: ../build/mtgen105
        optional: true
        compilerFlags: ["-O2", "-w"]
      - path: ../build/mtgen106
        optional: true
        compilerFlags: ["-O2", "-w"]
      - path: ../build/mtgen107
        optional: true
        compilerFlags: ["-O2", "-w"]
      - path: ../core/x86
        includes: ["x86.c"]
      - path: ../core/mt
        excludes: ["mtcli.c", "mtimports.c", "mtsay.c", "mtswitch.c"]
      - path: ../third_party/glint
        includes: ["aac_decoder.cpp"]
    settings:
      base:
        PRODUCT_NAME: EngineCode
        # No C debug info: for this much generated code it takes gigabytes of
        # memory per file
        GCC_GENERATE_DEBUGGING_SYMBOLS: NO
  # The Mac app as released: no generated code (it's made from Apple's
  # engines, so the app builds it on each Mac and loads it from the App Group).
  EngineCodePublic:
    type: library.static
    sources:
      - path: ../core
        includes: ["thumb.c", "vxengine.c", "vxstream.c", "vxphonemes.c", "vxrules.c", "vxlang.c"]
      - path: ../ports/posix
        includes: ["vx_native_dl.c"]
      - path: ../ports/apple
        excludes: ["mt_native_glue.c"]  # built into each fast-code library on the Mac
      - path: ../core/x86
        includes: ["x86.c"]
      - path: ../core/mt
        excludes: ["mtcli.c", "mtimports.c", "mtsay.c", "mtswitch.c"]
      - path: ../third_party/glint
        includes: ["aac_decoder.cpp"]
    settings:
      base:
        PRODUCT_NAME: EngineCode
        GCC_GENERATE_DEBUGGING_SYMBOLS: NO
        GCC_PREPROCESSOR_DEFINITIONS: ["$(inherited)", "VX_DYNAMIC_NATIVE=1", "VX_NO_STATIC_NATIVE=1", "VX_MT_DYNAMIC_NATIVE=1"]
  Engine:  # what every app and extension carries
    sources: [Shared]
    dependencies:
      - target: ${engine}
        link: false
    settings:
      base:
        # all of it: the recompiled MacinTalk registers itself from a
        # constructor nothing refers to
        OTHER_LDFLAGS: ["$(inherited)", "-Wl,-force_load,$(BUILT_PRODUCTS_DIR)/libEngineCode.a", "-lc++"]
        MARKETING_VERSION: "0.5.0"
        CURRENT_PROJECT_VERSION: "5"
  App:
    templates: [Engine]
    type: application
    sources:
      - App
      # the greetings of voices not downloaded yet (tools/make_samples.py)
      - path: Samples
        type: folder
        optional: true
    dependencies:
      - sdk: Accelerate.framework
      - sdk: AudioToolbox.framework
      - sdk: libsqlite3.tbd
      - sdk: libbz2.tbd
      - sdk: libz.tbd
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Classic Voices
  SynthBase:
    templates: [Engine]
    type: app-extension
    sources: [Synth]
    dependencies:
      - sdk: Accelerate.framework
      - sdk: AudioToolbox.framework
      - sdk: libsqlite3.tbd
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Synth/Info.plist
  Synth:
    templates: [SynthBase]
    postBuildScripts:
      - name: Bundle firmware voices
        script: |
          set -e
          for B in ios70 ios7 ios6 ios5 ios4 ios3; do
            SRC="$SRCROOT/../extracted/$B/VoiceServices.framework"
            DST="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/Voices/$B"
            mkdir -p "$DST"
            cp "$SRC/Support/voiced" "$DST/voiced"
            rsync -a --delete "$SRC/TTSResources/" "$DST/TTSResources/"
          done
          # iOS 10's speech bundle: only the engine for Mavericks premium voices
          mkdir -p "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/Voices/ios10"
          cp "$SRCROOT/../extracted/ios10/TTSSpeechBundle.speechbundle/TTSSpeechBundle" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/Voices/ios10/voiced"
          # MacinTalk generations (Alex is copied onto each device separately: ~400-670 MB)
          for G in mt104 mt105 mt106 mt107; do
            if [ -e "$SRCROOT/../extracted/$G/MacinTalk" ]; then
              rsync -aL --delete --exclude Alex.SpeechVoice --exclude Alex-sequoia.SpeechVoice "$SRCROOT/../extracted/$G/" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/Voices/$G/"
            fi
          done
          # Mac OS X compact voices and the common data the downloadable ones
          # use (iOS 7 is only the engine for Mavericks voices)
          for M in mac107 mac108 mac109; do
            if [ -d "$SRCROOT/../extracted/$M" ]; then
              rsync -a --delete "$SRCROOT/../extracted/$M/" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/Voices/$M/"
            fi
          done
        basedOnDependencyAnalysis: false
  # iPhone and Vision Pro share bundle identifiers and entitlements
  # (sideloading tools replace both with the user's own).
  DeviceApp:
    templates: [App]
    dependencies:
      - target: ${synth}
    entitlements:
      path: App/ClassicVoices.entitlements
      properties:
        com.apple.security.application-groups: [group.com.levigobin.ClassicVoices]
    settings:
      base:
        PRODUCT_NAME: ClassicVoices
        PRODUCT_BUNDLE_IDENTIFIER: com.levigobin.ClassicVoices
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
  DeviceSynth:
    templates: [Synth]
    entitlements:
      path: Synth/Synth.entitlements
      properties:
        com.apple.security.application-groups: [group.com.levigobin.ClassicVoices]
    settings:
      base:
        PRODUCT_NAME: Synth
        PRODUCT_BUNDLE_IDENTIFIER: com.levigobin.ClassicVoices.Synth

targets:
  ClassicVoices:
    templates: [DeviceApp]
    templateAttributes: { synth: Synth, engine: EngineCodeiOS }
    platform: iOS
  Synth:
    templates: [DeviceSynth]
    templateAttributes: { engine: EngineCodeiOS }
    platform: iOS
  EngineCodeiOS:
    templates: [EngineCode]
    platform: iOS

  ClassicVoicesVision:
    templates: [DeviceApp]
    templateAttributes: { synth: SynthVision, engine: EngineCodeVision }
    platform: visionOS
  SynthVision:
    templates: [DeviceSynth]
    templateAttributes: { engine: EngineCodeVision }
    platform: visionOS
  EngineCodeVision:
    templates: [EngineCode]
    platform: visionOS

  ClassicVoicesMac:
    templates: [App]
    templateAttributes: { engine: EngineCodeMac }
    platform: macOS
    sources:
      - App
      - path: Samples
        type: folder
        optional: true
      - MacApp
    dependencies:
      - target: SynthMac
    entitlements:
      path: App/ClassicVoicesMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-only: true
        com.apple.security.application-groups: [7WV49AN2BX.com.levigobin.ClassicVoices]
    settings:
      base:
        PRODUCT_NAME: Classic Voices
        PRODUCT_BUNDLE_IDENTIFIER: com.levigobin.ClassicVoices.mac
  SynthMac:
    templates: [Synth]
    templateAttributes: { engine: EngineCodeMac }
    platform: macOS
    entitlements:
      path: Synth/SynthMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups: [7WV49AN2BX.com.levigobin.ClassicVoices]
    settings:
      base:
        PRODUCT_NAME: Synth
        PRODUCT_BUNDLE_IDENTIFIER: com.levigobin.ClassicVoices.mac.Synth
  EngineCodeMac:
    templates: [EngineCode]
    platform: macOS

  # The Mac app as released (tools/release_mac.sh): nothing of Apple's in it.
  # It gets the engines from Apple's servers and archive.org itself, builds
  # their fast code on the Mac, and updates itself. Not sandboxed (it runs the
  # compiler and replaces itself); its extension is, and loads what the app
  # leaves in the App Group. Same identifiers as ClassicVoicesMac.
  ClassicVoicesMacPublic:
    templates: [App]
    templateAttributes: { engine: EngineCodeMacPublic }
    platform: macOS
    sources:
      - App
      - path: Samples
        type: folder
        optional: true
      - MacApp
    dependencies:
      - target: SynthMacPublic
    postBuildScripts:
      - name: Fast code sources
        # what the app compiles on the Mac (MacApp/FastCodeBuilder.swift): the
        # instruction semantics, the libraries' glue and the profiles (addresses only)
        script: |
          set -e
          D="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/FastCode"
          rm -rf "$D"; mkdir -p "$D/core/x86" "$D/core/mt" "$D/profiles"
          cp "$SRCROOT/../core/thumb.h" "$SRCROOT/../core/thumb_ops.h" "$SRCROOT/../core/recomp_rt.h" "$D/core/"
          cp "$SRCROOT/../core/x86/x86.h" "$SRCROOT/../core/x86/x86_ops.h" "$D/core/x86/"
          cp "$SRCROOT/../core/mt/mt_native.h" "$D/core/mt/"
          cp "$SRCROOT/../nvda/src/native_glue.c" "$SRCROOT/../ports/apple/mt_native_glue.c" "$D/"
          cp "$SRCROOT/../tools/profiles/"*.txt "$D/profiles/"
        basedOnDependencyAnalysis: false
    entitlements:
      path: App/ClassicVoicesMacPublic.entitlements
      properties:
        com.apple.security.application-groups: [7WV49AN2BX.com.levigobin.ClassicVoices]
    settings:
      base:
        PRODUCT_NAME: Classic Voices
        PRODUCT_BUNDLE_IDENTIFIER: com.levigobin.ClassicVoices.mac
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: Developer ID Application
        OTHER_CODE_SIGN_FLAGS: ["--timestamp"]  # notarization wants a secure timestamp
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO  # no get-task-allow: notarization refuses it
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: ["$(inherited)", "CV_PUBLIC"]
  SynthMacPublic:
    templates: [SynthBase]
    templateAttributes: { engine: EngineCodeMacPublic }
    platform: macOS
    entitlements:
      path: Synth/SynthMacPublic.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups: [7WV49AN2BX.com.levigobin.ClassicVoices]
        # the fast code the app compiles on this Mac
        com.apple.security.cs.disable-library-validation: true
    settings:
      base:
        PRODUCT_NAME: Synth
        PRODUCT_BUNDLE_IDENTIFIER: com.levigobin.ClassicVoices.mac.Synth
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: Developer ID Application
        OTHER_CODE_SIGN_FLAGS: ["--timestamp"]  # notarization wants a secure timestamp
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO  # no get-task-allow: notarization refuses it
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: ["$(inherited)", "CV_PUBLIC"]
  EngineCodeMacPublic:
    templates: [EngineCodePublic]
    platform: macOS
