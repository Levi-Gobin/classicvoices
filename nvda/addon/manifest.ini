name = classicvoices
summary = "Classic Voices (the iOS 3-6 and Mac OS X Lion-Mavericks Vocalizer voices)"
description = """The nostalgic VoiceOver voices: Samantha from iOS 6 and from iOS 3, Karen, Daniel and the rest, plus the Nuance Vocalizer voices Mac OS X Lion, Mountain Lion and Mavericks offered in System Preferences. They run on Apple's original engines, emulated bit-exactly, so they sound exactly as they did.

Nothing of Apple's ships in this add-on. You supply your own iPhone firmware: point the import tool (NVDA menu, Tools, Classic Voices data) at an IPSW file, and the engine and built-in voices are taken out of it. Once a firmware's engine is in place, the matching enhanced voices and the Mac OS X voices can be downloaded from Apple's own servers, which still host them.

MacinTalk (Fred, Alex, Victoria and friends) is deliberately not here: Panthera Speech by Tamas Geczy already does that beautifully, and this add-on follows its approach for the Vocalizer generations instead."""
author = "Levi Gobin (engine port); Apple and Nuance made the voices"
url = https://github.com/levi-gobin/classicvoices
version = 0.1.1
minimumNVDAVersion = 2023.1
lastTestedNVDAVersion = 2026.2
