name: Build NVDA add-on
on:
  workflow_dispatch:
  push:
    branches: [nvda-addon]
    paths: ["nvda/**", "core/**", ".github/workflows/nvda.yml"]

jobs:
  addon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW-w64 cross compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 gcc-mingw-w64-i686
      - name: llvm-mingw, for the ARM64EC engine (x64 programs on Windows on Arm run it natively)
        run: |
          f=llvm-mingw-20261006-ucrt-ubuntu-22.04-x86_64.tar.xz
          curl -sSfL -o "$RUNNER_TEMP/$f" "https://github.com/mstorsjo/llvm-mingw/releases/download/20261006/$f"
          echo "5f9c6ed95b2d4bdb2869a488c5fd5857fbdabcf288a0aa3eb1da43f6a08d8ab4  $RUNNER_TEMP/$f" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP"
          echo "CC_ARM64EC=$RUNNER_TEMP/${f%.tar.xz}/bin/arm64ec-w64-mingw32-clang" >> "$GITHUB_ENV"
      - name: Build DLLs and package the add-on
        run: |
          python3 nvda/build.py all \
            --cc-x64 x86_64-w64-mingw32-gcc-posix \
            --cc-x86 i686-w64-mingw32-gcc-posix \
            --cc-arm64ec "$CC_ARM64EC"
      - uses: actions/upload-artifact@v4
        with:
          name: classicvoices-nvda-addon
          path: build/*.nvda-addon
