# Builds Classic Voices in your own fork, from firmware downloaded from
# Apple's servers during the run (and the Tiger, Leopard and Snow Leopard
# install discs kept on archive.org): the iPhone and Apple Vision Pro apps,
# the Mac app and the NVDA add-on. Nothing Apple made is stored in this
# repository: the engines and voices are fetched, and the fast engine code is
# generated from them, inside your run only.
#
# Before the first run, add a repository secret named IPA_PASSWORD
# (Settings > Secrets and variables > Actions). Every download made from
# Apple's files is zipped with that password, because artifacts of a public
# fork can be downloaded by anyone signed in to GitHub. The one-line scripts
# (classicvoices.ps1 and classicvoices.sh) set it for you.
name: Build Classic Voices

on:
  workflow_dispatch:
    inputs:
      targets:
        description: "What to build: any of iphone, mac, nvda, visionpro"
        default: "iphone mac nvda"

jobs:
  iphone:  # also Vision Pro: the same firmware and engines
    if: contains(inputs.targets, 'iphone') || contains(inputs.targets, 'visionpro')
    runs-on: macos-15
    timeout-minutes: 300  # iPhone and Vision Pro each compile the fast code twice (app and extension)
    steps:
      - uses: actions/checkout@v4

      - name: Check the password secret
        env:
          IPA_PASSWORD: ${{ secrets.IPA_PASSWORD }}
        run: |
          if [ -z "$IPA_PASSWORD" ]; then
            echo "::error::Add a repository secret named IPA_PASSWORD first (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - name: Tools
        run: |
          brew install xcodegen
          python3 -m venv .venv
          .venv/bin/pip install --quiet cryptography

      - name: Fetch firmware from Apple
        env:
          PYTHON: .venv/bin/python
        run: tools/fetch_firmware.sh

      - name: Fetch Lion's MacinTalk from Apple
        run: tools/fetch_macintalk.sh

      - name: Fetch Tiger, Leopard and Snow Leopard's MacinTalk from archive.org
        run: python3 tools/fetch_old_macintalk.py --keep-going

      - name: Generate the fast engines
        env:
          PYTHON: .venv/bin/python
        run: |
          tools/build_engines.sh
          tools/build_mt_native.sh

      - name: Build the app
        if: contains(inputs.targets, 'iphone')
        run: tools/package_ipa.sh iphone

      - name: Build the Vision Pro app
        if: contains(inputs.targets, 'visionpro')
        run: tools/package_ipa.sh visionpro

      - name: Protect the download
        env:
          IPA_PASSWORD: ${{ secrets.IPA_PASSWORD }}
        run: |
          cd build
          for N in ClassicVoices ClassicVoicesVision; do
            [ -f "$N.ipa" ] || continue
            mkdir -p "upload-$N"
            zip -q -P "$IPA_PASSWORD" "upload-$N/$N-ipa.zip" "$N.ipa"
          done

      - uses: actions/upload-artifact@v4
        if: contains(inputs.targets, 'iphone')
        with:
          name: ClassicVoices
          path: build/upload-ClassicVoices/*
          retention-days: 3
          compression-level: 0

      - uses: actions/upload-artifact@v4
        if: contains(inputs.targets, 'visionpro')
        with:
          name: ClassicVoicesVision
          path: build/upload-ClassicVoicesVision/*
          retention-days: 3
          compression-level: 0

  mac:
    if: contains(inputs.targets, 'mac')
    runs-on: macos-15
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4

      - name: Check the password secret
        env:
          IPA_PASSWORD: ${{ secrets.IPA_PASSWORD }}
        run: |
          if [ -z "$IPA_PASSWORD" ]; then
            echo "::error::Add a repository secret named IPA_PASSWORD first (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - name: Tools
        run: |
          brew install xcodegen
          python3 -m venv .venv
          .venv/bin/pip install --quiet cryptography

      - name: Fetch firmware from Apple
        env:
          PYTHON: .venv/bin/python
        run: tools/fetch_firmware.sh

      - name: Fetch Lion's MacinTalk from Apple
        run: tools/fetch_macintalk.sh

      - name: Fetch Tiger, Leopard and Snow Leopard's MacinTalk from archive.org
        run: python3 tools/fetch_old_macintalk.py --keep-going

      - name: Generate the fast engines
        env:
          PYTHON: .venv/bin/python
        run: |
          tools/build_engines.sh
          tools/build_mt_native.sh

      - name: Build the Mac app
        run: tools/package_mac.sh

      - name: Protect the download
        env:
          IPA_PASSWORD: ${{ secrets.IPA_PASSWORD }}
        run: |
          mkdir build/upload
          cd build
          zip -q -0 -P "$IPA_PASSWORD" upload/ClassicVoices-mac-locked.zip ClassicVoices-mac.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ClassicVoicesMac
          path: build/upload/*
          retention-days: 3
          compression-level: 0

  # The add-on itself holds nothing of Apple's, so it isn't password-protected.
  nvda-addon:
    if: contains(inputs.targets, 'nvda')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW-w64 cross compilers
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gcc-mingw-w64-x86-64 gcc-mingw-w64-i686
      - name: Build the NVDA add-on
        run: |
          python3 nvda/build.py all \
            --cc-x64 x86_64-w64-mingw32-gcc-posix \
            --cc-x86 i686-w64-mingw32-gcc-posix
      - uses: actions/upload-artifact@v4
        with:
          name: ClassicVoicesNVDA
          path: build/*.nvda-addon
          retention-days: 3

  # NVDA's engines, voices and fast engine code, all made from the firmware:
  # zipped with your password, and unpacked into NVDA's classicvoices folder.
  # Built on a Mac, which reads every firmware's disk image (iOS 10.3 uses
  # APFS), cross-compiling the Windows DLLs with llvm-mingw.
  nvda-data:
    if: contains(inputs.targets, 'nvda')
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Check the password secret
        env:
          IPA_PASSWORD: ${{ secrets.IPA_PASSWORD }}
        run: |
          if [ -z "$IPA_PASSWORD" ]; then
            echo "::error::Add a repository secret named IPA_PASSWORD first (Settings > Secrets and variables > Actions)."
            exit 1
          fi
      - name: Tools
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet cryptography
          curl -sL https://github.com/mstorsjo/llvm-mingw/releases/download/20250528/llvm-mingw-20250528-ucrt-macos-universal.tar.xz | tar -xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP"/llvm-mingw-*/bin >> "$GITHUB_PATH"
      - name: Fetch firmware from Apple
        env:
          PYTHON: .venv/bin/python
        run: tools/fetch_firmware.sh
      - name: Build NVDA's voices and fast engines
        run: |
          python3 -c "import sys; sys.path.insert(0, 'nvda/addon/synthDrivers'); from _classicvoices import firmware; firmware.import_extracted('extracted', 'build/nvda-data/Voices', lambda m, f: None)"
          python3 nvda/build_native.py --source extracted --out build/nvda-data/Native
      - name: Protect the download
        env:
          IPA_PASSWORD: ${{ secrets.IPA_PASSWORD }}
        run: |
          cd build/nvda-data
          zip -q -r -P "$IPA_PASSWORD" ../ClassicVoicesNVDA-data.zip Voices Native
      - uses: actions/upload-artifact@v4
        with:
          name: ClassicVoicesNVDAData
          path: build/ClassicVoicesNVDA-data.zip
          retention-days: 3
          compression-level: 0
