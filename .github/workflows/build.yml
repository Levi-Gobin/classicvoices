# Builds Classic Voices for iPhone in your own fork, from firmware downloaded
# from Apple's servers during the run. Nothing Apple made is stored in this
# repository: the engines and voices are fetched, and the fast engine code is
# generated from them, inside your run only.
#
# Before the first run, add a repository secret named IPA_PASSWORD
# (Settings > Secrets and variables > Actions). The finished app is zipped with
# that password, because artifacts of a public fork can be downloaded by anyone
# signed in to GitHub.
name: Build Classic Voices

on:
  workflow_dispatch:

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Check the password secret
        env:
          IPA_PASSWORD: ${{ secrets.IPA_PASSWORD }}
        run: |
          if [ -z "$IPA_PASSWORD" ]; then
            echo "::error::Add a repository secret named IPA_PASSWORD first (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - name: Tools
        run: |
          brew install xcodegen
          python3 -m venv .venv
          .venv/bin/pip install --quiet cryptography

      - name: Fetch firmware from Apple
        env:
          PYTHON: .venv/bin/python
        run: tools/fetch_firmware.sh

      - name: Generate the fast engines
        env:
          PYTHON: .venv/bin/python
        run: tools/build_engines.sh

      - name: Build the app
        run: tools/package_ipa.sh

      - name: Protect the download
        env:
          IPA_PASSWORD: ${{ secrets.IPA_PASSWORD }}
        run: |
          cd build
          zip -q -P "$IPA_PASSWORD" ClassicVoices-ipa.zip ClassicVoices.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: ClassicVoices
          path: build/ClassicVoices-ipa.zip
          retention-days: 3
          compression-level: 0
